        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #fff;
            color: #000;
            font-family: 'Orbitron', sans-serif;
            text-align: center;
        }
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap');
        
        .container {
            padding: 15px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            background: #fff;
        }
        
        .header {
            margin-bottom: 15px;
        }
        
        h1 {
            margin: 10px 0;
            font-size: 1.5rem;
            letter-spacing: 2px;
            color: #c00;
            text-shadow: 0 0 5px rgba(200, 0, 0, 0.3);
            font-weight: 700;
        }
        
        .bookmaker-display {
            font-size: 1rem;
            color: #000;
            font-weight: bold;
            margin-bottom: 15px;
            padding: 8px 15px;
            background: #f8f8f8;
            border-radius: 8px;
            border: 2px solid #c00;
            box-shadow: 0 0 8px rgba(200, 0, 0, 0.2);
        }
        
        .game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            width: 100%;
            margin-top: 15px;
        }
        
        .game-option {
            cursor: pointer;
            transition: transform 0.3s;
            width: 90%;
            max-width: 350px;
            position: relative;
            margin: 0 auto;
        }
        
        .game-option:active {
            transform: scale(0.98);
        }
        
        .game-image {
            width: 100%;
            height: 160px;
            border-radius: 15px;
            border: 3px solid blue;
            box-shadow: 0 0 15px rgba(200, 0, 0, 0.3);
            object-fit: cover;
            background-color: #fff;
        }
        
        /* Fallback for broken game images */
        .game-image.broken {
            background: linear-gradient(45deg, #ffcccc, #ff9999);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #c00;
            font-weight: bold;
            font-size: 14px;
            border: 3px solid #c00;
        }
        
        .game-title {
            position: absolute;
            top: -12px;
            left: 50%;
            transform: translateX(-50%);
            background: red;
            padding: 4px 15px;
            border-radius: 25px;
            font-weight: bold;
            font-size: 0.85rem;
            box-shadow: 0 0 12px rgba(200, 0, 0, 0.5);
            z-index: 2;
            color: white;
        }
        
        .telegram-section {
            margin-top: 20px;
            width: 90%;
            max-width: 350px;
        }
        
        .disclaimer {
            font-size: 0.8rem;
            color: #000;
            margin-bottom: 12px;
            padding: 10px 12px;
            background: #f8f8f8;
            border-radius: 8px;
            line-height: 1.4;
            border: 2px solid #c00;
            box-shadow: 0 0 8px rgba(200, 0, 0, 0.2);
            text-align: left;
        }
        
        .disclaimer h3 {
            margin: 0 0 8px 0;
            color: #c00;
            font-size: 0.9rem;
            text-align: center;
        }
        
        .disclaimer ul {
            margin: 0;
            padding-left: 15px;
            color: #000;
        }
        
        .disclaimer li {
            margin-bottom: 6px;
            font-size: 0.75rem;
            line-height: 1.3;
        }
        
        .warning-item {
            display: flex;
            align-items: center;
            margin-bottom: 6px;
            font-weight: bold;
        }
        
        .warning-icon {
            margin-right: 6px;
            font-size: 0.9rem;
            min-width: 20px;
        }
        
        .telegram-link {
            color: #0088cc;
            text-decoration: none;
            font-weight: bold;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            margin-left: 4px;
        }
        
        .verification-badge {
            background-color: #0088cc;
            color: white;
            border-radius: 50%;
            width: 14px;
            height: 14px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 9px;
            font-weight: bold;
        }
        
        .telegram-button {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px 15px;
            font-size: 0.75rem;
            color: #fff;
            font-weight: bold;
            background-color: #0088cc;
            border-radius: 25px;
            width: 100%;
            border: 2px solid #0088cc;
            box-shadow: 0 0 12px rgba(0, 136, 204, 0.3);
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s ease;
        }
        
        .telegram-button:hover {
            background-color: #0077b3;
            border-color: #0077b3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 136, 204, 0.5);
        }
        
        .telegram-button:active {
            transform: translateY(0);
            box-shadow: 0 2px 8px rgba(0, 136, 204, 0.5);
        }
        
        .telegram-icon {
            font-size: 1.1rem;
            margin-right: 6px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🚀 Aviator Predictor v7 🚀</h1>
            <div class="bookmaker-display" id="bookmakerDisplay">BOOKMAKER: 1XBET</div>
            <h4>🎰 SELECT GAME 🎰</h4>
        </div>
        
        <div class="game-container">
            <div class="game-option" onclick="selectGame('aviator')">
                <div class="game-title">🛫 𝐀𝐕𝐈𝐀𝐓𝐎𝐑 🛫</div>
                <img src="aviator.png" alt="Aviator" class="game-image" onerror="handleImageError(this)">
            </div>
        </div>
        
        <div class="telegram-section">
            <div class="disclaimer">
                <h3>⚠️ IMPORTANT DISCLAIMER ⚠️</h3>
                <ul>
                    <li class="warning-item">
                        <span class="warning-icon">🚫</span>
                        <span><strong>I do not use WhatsApp</strong></span>
                    </li>
                    <li class="warning-item">
                        <span class="warning-icon">🚫</span>
                        <span><strong>This app does not need VPN</strong></span>
                    </li>
                    <li class="warning-item">
                        <span class="warning-icon">⚠️</span>
                        <span><strong>Only contact </strong><a href="https://t.me/AviatorAdmin2" class="telegram-link" target="_blank">@AviatorAdmin2<span class="verification-badge">✓</span></a></span>
                    </li>
                    <li class="warning-item">
                        <span class="warning-icon">🔒</span>
                        <span><strong>Beware of fake accounts & scammers</strong></span>
                    </li>
                </ul>
            </div>
            
            <a href="https://t.me/AviatorPredictor_7" class="telegram-button" target="_blank" title="Join Official Telegram Channel">
                <i class="fab fa-telegram telegram-icon"></i>
                CLICK HERE TO JOIN CHANNEL
            </a>
        </div>
    </div>

    <script>
        // Image error handling
        function handleImageError(img) {
            img.classList.add('broken');
            const fallbackText = document.createElement('div');
            fallbackText.textContent = 'AVIATOR GAME';
            fallbackText.style.color = '#c00';
            fallbackText.style.fontWeight = 'bold';
            fallbackText.style.fontSize = '16px';
            
            img.parentNode.insertBefore(fallbackText, img);
            img.style.display = 'none';
        }

        document.addEventListener('DOMContentLoaded', function() {
            const bookmaker = localStorage.getItem('selectedBookmaker');
            if (bookmaker) {
                document.getElementById('bookmakerDisplay').textContent = 
                    `BOOKMAKER: ${bookmaker.toUpperCase()}`;
            }
        });
        
        function selectGame(game) {
            localStorage.setItem('selectedGame', game);
            window.location.href = 'login.html';
        }

        // Register Service Worker for PWA
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(registration => console.log('Service Worker registered'))
                    .catch(err => console.log('Service Worker registration failed: ', err));
            });
        }

        // Prevent zooming
        document.addEventListener('gesturestart', function(e) {
            e.preventDefault();
        });
        
        document.addEventListener('touchmove', function(e) {
            if (e.touches.length > 1) {
                e.preventDefault();
            }
        }, { passive: false });
    </script>
</body>
</html>
